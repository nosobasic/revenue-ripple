name: Billing target compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: billing-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  target:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/billing-disabled-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public PR head without persisted credentials
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin https://github.com/nosobasic/revenue-ripple.git
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Debian 12 amd64 Python 3.11.11 and 93 synthetic billing tests
        run: bash scripts/ci/billing_target.sh
